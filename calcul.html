<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLIALU — Calculette</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #222; }

    /* NAVBAR */
    .nav { background: #0d2933; padding: 0 20px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.3); }
    .nav-logo { margin-right: 30px; padding: 10px 0; display: flex; align-items: center; }
    .nav-logo img { height: 42px; object-fit: contain; }
    .nav-btn { background: none; border: none; color: #aaa; padding: 18px 20px; cursor: pointer; font-size: 14px; font-weight: 500; border-bottom: 3px solid transparent; transition: all .2s; text-decoration: none; display: inline-flex; align-items: center; }
    .nav-btn:hover { color: #fff; }
    .nav-btn.active { color: #fff; border-bottom-color: #e8fc69; }

    /* LAYOUT */
    .page { padding: 24px; max-width: 1100px; margin: 0 auto; }

    /* CARD */
    .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .card-title { font-size: 15px; font-weight: 700; color: #0d2933; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    .card-title::before { content: ''; display: block; width: 4px; height: 18px; background: #e8fc69; border-radius: 2px; }

    /* GRIDS */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }

    /* FORM */
    label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
    input, select, textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 14px; transition: border .2s; background: #fafafa; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0d2933; background: #fff; }

    /* BUTTONS */
    .btn { padding: 11px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: #0d2933; color: #fff; }
    .btn-primary:hover { background: #1a4a5c; }
    .btn-accent { background: #e8fc69; color: #0d2933; }
    .btn-accent:hover { background: #d4e85a; }
    .btn-outline { background: transparent; border: 2px solid #0d2933; color: #0d2933; }
    .btn-outline:hover { background: #0d2933; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

    /* MATIERE SELECTOR */
    .mat-selector { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .mat-btn { padding: 10px 20px; border: 2px solid #e5e7eb; border-radius: 8px; background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; color: #555; }
    .mat-btn:hover { border-color: #0d2933; color: #0d2933; }
    .mat-btn.active { background: #0d2933; color: #e8fc69; border-color: #0d2933; }

    /* RESULTS */
    .result-box { background: #f8fafc; border: 1.5px solid #e5e7eb; border-radius: 10px; padding: 16px; text-align: center; }
    .result-box .lbl { font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
    .result-box .val { font-size: 22px; font-weight: 800; color: #0d2933; }
    .result-box.highlight { background: #0d2933; border-color: #0d2933; }
    .result-box.highlight .lbl { color: #aaa; }
    .result-box.highlight .val { color: #e8fc69; }
    .result-box.green { background: #ecfdf5; border-color: #059669; }
    .result-box.green .val { color: #059669; }

    /* BADGE */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge-ok { background: #dcfce7; color: #166534; }
    .badge-warn { background: #fef9c3; color: #854d0e; }
    .badge-bad { background: #fee2e2; color: #991b1b; }

    /* SEPARATOR */
    .sep { border: none; border-top: 1px solid #f0f0f0; margin: 20px 0; }

    /* TOOLTIP INFO */
    .field-info { font-size: 11px; color: #9ca3af; margin-top: 3px; }

    /* SECTION HEADER */
    .section-sub { font-size: 11px; font-weight: 700; color: #0d2933; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 12px; padding-bottom: 6px; border-bottom: 2px solid #e8fc69; display: inline-block; }

    @media (max-width: 600px) {
      .grid2, .grid3, .grid4 { grid-template-columns: 1fr; }
    }
  </style>
</head>
